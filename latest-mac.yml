releaseName: Collabra 0.2.82 — 个人测试
releaseNotes: >
  # Collabra 0.2.82


  ## 插件浏览器桥


  - 插件可在本机根会话中操作内嵌浏览器：读取页面结构、定位 WPS 表格区域、复制当前选区、插入文本。

  - 浏览器只对插件声明的域名开放，tab 归属、目标 URL 与动作前后状态都会复查。

  - 只允许本机根会话的工具与界面调用；子代理、远端窗口、事件、定时与插件互调一律拒绝。

  - 写操作需通过插件写权限校验，取消的调用不会落地任何修改。


  ## 手机端按设计稿重做


  - 配对后的手机页面换成黑白视觉基座：反色胶囊、纸面圆角卡片、玻璃审批面板，彩色只留给运行、等待、出错与完成状态。

  - 会话列表改成品牌头加按项目分组；聊天屏、Bot 列表、群聊、文件列表、底部面板、新建会话与会话设置统一按稿整形。

  - 会话菜单收口为一个 ⋯ 入口；配对失效改成说明性状态页，明确对话不会丢失。

  - 清掉手机端低于 11px 的字号，只读状态下保留灰掉的输入条。


  ## 手机能看到会话里的图片


  - 新增 session-image 只读通道，手机端可看到会话中 read
  命中的图片和生成的图片；路径按权威工作区根校验，拒绝绝对路径、目录外引用和非常规文件。

  - 图片解码失败可重试恢复，同路径换图会真正重新取图；缓存按会话与工作区失效，并有上限。

  - 会话图片读取改为有界读取，文件超限立即拒绝，不再边读边判。


  ## Android 端


  - 输入草稿自动保存与恢复：切换页面、退到后台或重启后回来内容还在，过期草稿自动清理。

  - 新增设置页，成员页与导航随之调整。


  ## 团队自主执行


  - 团队成员与 Bot 的默认审批模式改为完全授权，新团队对话框补上自主执行说明，并按成员审批模式调整按钮文案。


  ## 发布范围与验收边界


  - Mac arm64 版使用原个人证书，发布到个人 prerelease 与独立个人更新清单，个人通道不修改正式 Latest。

  - 本次发布不包含工作区中未提交的本地测试改动。安装、退出和重启由用户操作；发布成功不代表已完成真机安装、旧数据保留或自动升级验收。


  ---


  个人测试通道 0.2.82：仅供信任 EnsoCode Local Signing 证书的 Mac arm64
  使用。不是正式发布（latest），未公证。安装与重启由用户操作。
