releaseName: EnsoCode 0.2.66 — 个人测试
releaseNotes: >
  # EnsoCode 0.2.66


  本次为 Mac arm64 个人更新，汇总自个人版 0.2.60 以来的桌面改进。


  ## 新功能与体验


  - **Eaves 新名称与图标**：桌面应用更新为 Eaves 品牌，包含应用、托盘与运行状态图标；沿用原有应用标识和个人签名证书。

  - **聊天排版**：在「设置 → 外观」分别调整正文、标题、表格、代码块和行内代码的字号与字重，支持预览、恢复默认和配置同步。

  - **Code 会话多技能**：输入框可叠加多个 `/skill:` 并按顺序展开，草稿、失败重发和回退保留技能与任务正文。

  - **模型中心**：可一次拉取全部供应商模型，分别显示刷新结果，单家失败不阻断其他供应商。

  - **聊天网页链接**：默认在会话内置浏览器打开，按住 Ctrl 点击可改用系统浏览器，也可在设置中关闭该行为。

  - **子代理完成报告**：正文使用 Markdown 展示，token、工具次数和耗时单独显示。


  ## 修复与稳定性


  - 保存聊天草稿，发送失败时保留输入；改进项目错误提示、首次引导焦点、任务通知和侧栏拖动反馈。

  - 修复从空聊天派活后加载状态不结束、关闭已无运行实体的子代理后标签页残留的问题。

  - 修复非默认界面缩放下内置浏览器与停靠 DevTools 的原生视图位置偏移。

  - 改进 Bot 成员实时会话与历史记录的加载，修复文件链接解析及有歧义的任务跟进处理。

  - 收紧历史与提醒文件的身份校验，避免已保存的供应商与 MCP 凭据从 Main 泄露到界面层。

  - 手机网页端不再把尽力而为的在线状态上报失败显示为命令错误，并补充配对协议的共享测试向量与回环测试。


  本次仅发布 Mac 桌面个人包，不发布 Android APK 或 Windows 新版本；Android 原生伴侣的开发与人工验收另行进行。


  ---


  个人测试通道 0.2.66：仅供信任 EnsoCode Local Signing 证书的 Mac arm64
  使用。不是正式发布（latest），未公证。安装与重启由用户操作。
