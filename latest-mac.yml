releaseName: EnsoCode 0.2.60 — 个人测试
releaseNotes: |
  # EnsoCode 0.2.60

  - **多个项目可以同时使用设计画布**：侧栏「设计」标签上新增「在新窗口打开画布」，把当前会话的画布弹到独立窗口。该会话的新建、截图、方向和素材等设计操作都在这个窗口里完成，主窗口切到别的项目也能同时设计，不再提示画布被其他项目占用。主窗口里对应位置显示「画布已在独立窗口中打开」，可一键切回；关闭独立窗口后恢复原来的方式。
  - 独立窗口里的备注派活仍发到所属会话，运行状态和「修改中 / 已更新」提示与主窗口同步；窗口只能访问自己会话的项目目录，进入托盘模式时会一并关闭。
  - 首版暂不支持 SSH 项目和 Bot 会话。

  ---

  个人测试通道 0.2.60：仅供信任 EnsoCode Local Signing 证书的 Mac arm64 使用。不是正式发布（latest），未公证。安装与重启由用户操作。
