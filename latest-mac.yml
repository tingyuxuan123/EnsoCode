releaseName: EnsoCode 0.2.58 — 个人测试
releaseNotes: |
  # EnsoCode 0.2.58

  - **从 Bot 聊天直接打开工作区设计稿**：右侧新增常驻「设计稿」入口。不需要先收到交稿消息，就能浏览、刷新并打开当前工作区的 `.vetd` 设计。缺少 `design.json` 但保留主题和画框源码的设计，也能发现并在打开时恢复。
  - **群聊里的图片交稿更容易看见**：图片产物直接显示缩略图，点击缩略图或正文中的文件链接可打开原图，不会读取该消息未交付的文件。
  - **设计成员先建画布再交稿**：独立视觉任务先加载设计技能、复用或创建画布，再编写画框并截图验稿。修复群委派的画布归属，避免在正确的话题中误报画布被其他项目占用。

  ---

  个人测试通道 0.2.58：仅供信任 EnsoCode Local Signing 证书的 Mac arm64 使用。不是正式发布（latest），未公证。安装与重启由用户操作。
