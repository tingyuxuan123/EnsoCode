releaseName: Collabra 0.2.81 — 个人测试
releaseNotes: >
  # Collabra 0.2.81


  ## Collabra 精选插件市场


  - 接入独立签名的 Collabra 插件市场，支持主源、镜像及断网目录回退。

  - 按插件 API、应用版本和平台选择最高兼容版本，并展示插件实测界面信息。

  - 市场索引和安装包继续执行签名、哈希及防回滚校验；旧来源安装保持原有归属，不被同名新市场插件接管或自动覆盖。


  ## 扩展管理与安装


  - 简化扩展管理与分类筛选，恢复插件图标展示，统一市场与已安装插件的详情入口。

  - 原生插件首次安装须经明确确认；预览、安装及权限状态保持一致，不因尚未安装而阻止正常首次安装。

  - 修复插件文档加载，并明确展示加载失败、缺少文档等结束状态。

  - 改善插件主题在主窗口、设计窗口和任务看板间的应用，补充会话活动状态与插件访问边界。


  ## 多代理协作


  - 多代理创建默认使用可保留上下文的 coworker 模式，便于继续交办后续任务；显式指定 task 时仍使用一次性任务模式。


  ## Windows 同步更新


  - 同步此前个人版的紧凑工作台布局、会话页签滚动与输入框用量摘要。

  - 同步外观主题预览、设计画廊全屏工作区、图片工作台布局及分栏动画改进。

  - 同步 Claude Code 插件与原生扩展入口分工，以及 Bot 模型选择、浏览器兼容性和界面响应修复。


  ## 发布范围与验收边界


  - Windows x64 版通过 CI 构建、包内原生依赖和设计引擎冒烟、远端资产哈希验收后公开并推进 Latest。

  - Mac arm64 版使用原个人证书，发布到个人 prerelease 与独立个人更新清单，不通过个人通道修改正式 Latest。

  - 本次发布不包含工作区中未提交的本地测试。安装、退出和重启由用户操作；发布成功不代表已完成真机安装、旧数据保留或自动升级验收。


  ---


  个人测试通道 0.2.81：仅供信任 EnsoCode Local Signing 证书的 Mac arm64
  使用。不是正式发布（latest），未公证。安装与重启由用户操作。
