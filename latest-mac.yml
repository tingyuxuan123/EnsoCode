releaseNotes: |
  # EnsoCode 0.2.57

  - **任务编号识别更准确**：`#1 先别动 #2。`、`#1 和#2一样` 这类带中英文句读或紧挨汉字的写法，和空格分隔一样识别为提到了另一个任务，退回普通群路由，不会把话送错执行；`#000` 这类纯数字色值保留在补充正文里。
  - **任务托管提醒更合理**：长时间无输出按每一段静默提醒一次，恢复输出后再次静默会重新提醒。同一轮检查出多个需要处理的任务时，群时间线逐条记录，系统通知合并为一条并列出任务号，不再连发。
  - **任务托管开关**：保存期间暂时锁住，连续点击不再弹出版本冲突提示。后台巡检不再反复读取群聊历史文件。

  ---

  个人测试通道 0.2.57：仅供信任 EnsoCode Local Signing 证书的 Mac arm64 使用。不是正式发布（latest），未公证。安装与重启由用户操作。
