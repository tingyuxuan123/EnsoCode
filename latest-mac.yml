releaseNotes: |
  # EnsoCode 0.2.55

  - **新浅色方案「云白」**：在「设置 → 外观 → 浅色方案」中可选。冷灰外壳衬托白色工作区，自己发出的消息为亮蓝圆角气泡，输入框和弹层采用更圆润的样式；蓝色只用于消息、发送和聚焦。仅在浅色外观下生效，深色和同步终端配色不受影响。
  - **协作看板**：已完成任务仅展示最近七天，列表更聚焦。
  - **内置浏览器**：修复设备预览在截图后网页背景溢出设备框的问题。

  ---

  个人测试通道 0.2.55：仅供信任 EnsoCode Local Signing 证书的 Mac arm64 使用。不是正式发布（latest），未公证。安装与重启由用户操作。
