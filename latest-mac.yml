  # CodeKiln 0.2.100


  ## 桌面与设备操控


  - 电脑操控支持用四个坐标值或坐标点列表指定拖拽路径。窗口列表会隐藏电脑操控自己的预览和占用提示窗口，避免选错目标。

  - 修复安装包内设备操控 CLI 的文件布局，设备主机现在可以从归档外启动 CLI。


  ## 界面


  - 修复项目侧栏收起时最后几像素卡住的问题。


