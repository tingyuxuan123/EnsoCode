releaseNotes: >
  # 小满 0.2.71


  ## 移除超级助理


  - 移除左侧「超级助理 / Super Assistant」入口、专属工作区和跨项目协调派发能力，保留原有 Code、Bot、设计及普通 Agent 功能。

  - 旧超级助理的对话文件与任务账本保留在本地，但不再显示、启动或恢复投递。

  - 超级助理曾创建的普通 Code 会话仍可打开，保留原有历史、模型、推理与审批设置；补齐不完整旧缓存时不覆盖已有完整模型选择。

  - 曾停留在超级助理模式的旧设置会回到 Code，不影响其他导航入口的顺序。


  本次仅发布 Mac arm64 同证书个人更新版，不改变正式 Latest。安装和重启由用户自行完成。


