releaseNotes: >
  # CodeKiln 0.2.98


  ## 移除 LCU 电脑控制扩展接入


  - 移除设置中的 LCU 开关和专属自动授权。已安装的旧 LCU 入口不再随 CodeKiln 会话加载，避免其 `js` 工具参数导致部分
  Responses 模型拒绝整轮请求。

  - 保留 CodeKiln 自带的「电脑操控」及其他 Pi 扩展，不卸载本机 LCU，也不改写 Pi 配置。


  ## 设置页


  - 记忆知识图谱和代码编辑器按需加载，打开设置时不再提前加载它们。


  ---


  个人测试通道 0.2.98：仅供信任 EnsoCode Local Signing 证书的 Mac arm64
  使用。不是正式发布（latest），未公证。安装与重启由用户操作。
