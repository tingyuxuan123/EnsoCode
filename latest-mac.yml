releaseNotes: >
  # CodeKiln 0.2.103


  ## 记忆与知识


  - 移除旧的本地记忆与 Wiki 记忆子系统，包括记忆工具、记忆桥接、清理任务和对应设置项；升级时自动清理遗留设置键与已停用的记忆工具开关。

  - 新增 llmdoc 知识地图插件（示例插件）：只读浏览、检索和复核当前 Git 项目里的 `llmdoc/` 知识文档，Git 诊断限定在当前工作树内。

  - 随仓库补充 `llmdoc/` 知识文档目录，覆盖发布流程与会话投影等主题。


  ## 文档与工程


  - 更新 README 的功能说明、工作台截图与数据目录细节。

  - 测试脚本纳入 llmdoc 插件测试，忽略其本机缓存目录。


  ## 其他


  - 修复图片设置里模型下拉选项显示不全的问题。

  - 图片工坊支持选择和复制对话中的提示词。


  ---


  个人测试通道 0.2.103：仅供信任 EnsoCode Local Signing 证书的 Mac arm64
  使用。不是正式发布（latest），未公证。安装与重启由用户操作。
