<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Eaves「运行中」小尺寸版（≤24px）：线条更粗、雨滴更大且始终可见，去掉中间那根静止短线。
       减少动态效果时停在静止的标志上。 -->
  <style>
    .e { fill: none; stroke: #f4f5f6; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
    .s { fill: none; stroke: #f4f5f6; stroke-width: 9; stroke-linecap: round; }
    .r1 { stroke-dasharray: 12 15; animation: f27 1.05s linear infinite; }
    .r3 { stroke-dasharray: 16 13; animation: f29 1.2s linear infinite; animation-delay: -0.5s; }
    .d { fill: #3b82f6; transform-box: fill-box; transform-origin: center; animation: drop 1.2s infinite; animation-delay: -0.45s; }
    @keyframes f27 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -27; } }
    @keyframes f29 { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -29; } }
    @keyframes drop {
      0%   { transform: translateY(0) scale(0.55); opacity: 1; animation-timing-function: ease-out; }
      25%  { transform: translateY(1px) scale(1); opacity: 1; animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
      85%  { opacity: 1; }
      100% { transform: translateY(20px) scale(1); opacity: 0.15; }
    }
    @media (prefers-reduced-motion: reduce) {
      .r1, .r3, .d { animation: none; }
      .d { transform: translateY(10px); }
    }
  </style>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.12" stop-color="#fff"/>
      <stop offset="0.82" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="rain" maskUnits="userSpaceOnUse" x="0" y="42" width="100" height="48">
      <rect x="0" y="42" width="100" height="48" fill="url(#fade)"/>
    </mask>
  </defs>
  <path class="e" d="M10 22 Q14 31 25 32 L75 32 Q86 31 90 22"/>
  <g mask="url(#rain)">
    <path class="s r1" d="M28 30 V100"/>
    <path class="s r3" d="M72 30 V100"/>
  </g>
  <circle class="d" cx="50" cy="56" r="8"/>
</svg>