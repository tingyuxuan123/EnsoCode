<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; frame-src 'none'; form-action 'none'; base-uri 'none'; navigate-to 'none'" />
  <script>
    (() => {
      const nonce = location.hash.slice(1);
      let port = null;
      let sequence = 0;
      let theme = 'light';
      let file = null;
      const store = Object.create(null);
      const themeListeners = new Set();
      const fileListeners = new Set();
      const eventListeners = new Map();
      const emit = (listeners, value) => { for (const listener of listeners || []) { try { listener(value); } catch {} } };
      const subscribe = (listeners, listener) => { if (typeof listener !== 'function') return () => {}; listeners.add(listener); return () => listeners.delete(listener); };
      const storage = Object.freeze({
        get(key) { return Object.hasOwn(store, key) ? store[key] : null; },
        set(key, value) { const name = String(key); const text = String(value); store[name] = text; port?.postMessage({ type: 'enso-storage', patch: { [name]: text } }); },
        remove(key) { delete store[key]; port?.postMessage({ type: 'enso-storage', patch: { [key]: null } }); },
      });
      try { Object.defineProperty(window, 'localStorage', { configurable: false, value: Object.freeze({ getItem: storage.get, setItem: storage.set, removeItem: storage.remove, clear() { for (const key of Object.keys(store)) storage.remove(key); }, key(index) { return Object.keys(store)[index] ?? null; }, get length() { return Object.keys(store).length; } }) }); } catch {}
      const fileApi = Object.freeze({
        get rel() { return file?.rel || ''; }, get text() { return file?.text || ''; },
        onChange(listener) { return subscribe(fileListeners, listener); },
        update(text) { if (!file || !port) return; file = { rel: file.rel, text: String(text) }; port.postMessage({ type: 'enso-file-edit', text: file.text }); },
      });
      const pending = new Map();
      Object.defineProperty(window, 'enso', { configurable: false, writable: false, value: Object.freeze({
        get theme() { return theme; },
        get file() { return file ? fileApi : null; },
        storage,
        onTheme(listener) { return subscribe(themeListeners, listener); },
        on(name, listener) { if (typeof name !== 'string' || !name) return () => {}; let list = eventListeners.get(name); if (!list) { list = new Set(); eventListeners.set(name, list); } return subscribe(list, listener); },
        call(method, args) {
          if (!port) return Promise.reject(new Error('bridge not ready'));
          const id = ++sequence;
          return new Promise((resolve, reject) => { pending.set(id, { resolve, reject }); port.postMessage({ id, method, args: args ?? null }); });
        },
      }) });
      const initialize = (event) => {
        const data = event.data;
        if (port || event.source !== window.parent || !nonce || !data || data.type !== 'enso-view-init' || data.nonce !== nonce || typeof data.html !== 'string' || event.ports.length !== 1) return;
        window.removeEventListener('message', initialize);
        port = event.ports[0]; theme = data.theme === 'dark' ? 'dark' : 'light';
        if (data.file && typeof data.file.rel === 'string' && typeof data.file.text === 'string') file = { rel: data.file.rel, text: data.file.text };
        if (data.storage && typeof data.storage === 'object') for (const [key, value] of Object.entries(data.storage)) if (typeof value === 'string') store[key] = value;
        port.onmessage = ({ data: reply }) => {
          if (reply?.type === 'enso-theme') { if (reply.theme !== 'dark' && reply.theme !== 'light') return; theme = reply.theme; document.documentElement.dataset.theme = theme; emit(themeListeners, theme); return; }
          if (reply?.type === 'enso-view-event') { emit(eventListeners.get(reply.name), reply.data); return; }
          if (reply?.type === 'enso-file') { if (!file || typeof reply.rel !== 'string' || typeof reply.text !== 'string' || (reply.rel === file.rel && reply.text === file.text)) return; file = { rel: reply.rel, text: reply.text }; emit(fileListeners, file); return; }
          const entry = reply && pending.get(reply.id);
          if (!entry) return;
          pending.delete(reply.id);
          if (reply.ok) entry.resolve(reply.value); else entry.reject(new Error(String(reply.error)));
        };
        // Preserve this document's CSP instead of replacing the head with plugin HTML.
        const documentBody = new DOMParser().parseFromString(data.html, 'text/html');
        document.documentElement.dataset.theme = theme;
        for (const node of [...documentBody.head.childNodes, ...documentBody.body.childNodes]) {
          if (node.nodeType === Node.ELEMENT_NODE && ['META', 'BASE'].includes(node.tagName)) continue;
          if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'SCRIPT') {
            const script = document.createElement('script'); script.textContent = node.textContent; document.body.appendChild(script);
          } else document.body.appendChild(document.importNode(node, true));
        }
      };
      // No navigation/UI popup privileges are granted by sandbox. Block link/form defaults too.
      document.addEventListener('click', (event) => { if (event.target.closest?.('a')) event.preventDefault(); }, true);
      document.addEventListener('submit', (event) => event.preventDefault(), true);
      window.addEventListener('message', initialize);
    })();
  </script>
</head>
<body></body>
</html>
