name: Android checks

on:
  pull_request:
    paths:
      - 'android/**'
      - 'packages/pair/**'
      - 'packages/relay-go/**'
      - 'scripts/pair-*.mjs'
      - 'scripts/android-pair-smoke.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'packages/pair/**'
      - 'packages/relay-go/**'
      - 'scripts/pair-*.mjs'
      - 'scripts/android-pair-smoke.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: packages/relay-go/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/pair-vectors.mjs --check
      - run: node --test scripts/pair-fake-host.test.mjs
        env:
          PAIR_FAKE_HOST_GO: '1'
      - name: Kotlin guest against real relay and fake host
        run: ./gradlew --no-daemon :pair:interopTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-pair-interop-reports
          path: android/pair/build/reports/tests/interopTest/
          if-no-files-found: ignore
          retention-days: 7
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The retired `tools` package is no longer available; install pinned SDKs below.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and debug builds
        run: ./gradlew --no-daemon check :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/pair/build/reports/
            android/mirror/build/reports/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: eaves-debug-only
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
