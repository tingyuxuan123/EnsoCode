name: Build Windows Only

# 独立 tag 不匹配 v* / personal-v*，不会触发 Mac、Linux 或中继构建。
on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted release ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node -e 'const v = require("./package.json").version; if (process.env.GITHUB_REF.startsWith("refs/tags/") && process.env.TAG !== `windows-v${v}`) process.exit(1)'
          PUBLISHED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft == false) | .tag_name')
          test -z "$PUBLISHED" || { echo 'Published versions are immutable; use a new version.'; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore pnpm cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version and run release gates
        run: pnpm release:check
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build app
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: windows-app-build
          path: out/
          retention-days: 1

  build-windows:
    needs: build-app
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: windows-app-build
          path: out/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare bundled design engine (Windows x64)
        run: node scripts/prepare-design-engine.mjs
        env:
          npm_config_arch: x64

      - name: Verify Windows design paths
        run: >-
          pnpm exec vitest run src/shared/design/paths.test.ts
          src/renderer/features/design/host/paths.test.ts
          src/main/services/design/windowsDesignPath.test.ts
          --maxWorkers=2 --testTimeout=15000

      - name: Build Windows
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Smoke test packaged natives and design engine
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          set -euo pipefail
          dist/win-unpacked/EnsoCode.exe scripts/smoke-packaged-natives.cjs dist/win-unpacked/resources
          dist/win-unpacked/EnsoCode.exe scripts/smoke-packaged-design.cjs dist/win-unpacked/resources

      - name: Verify Windows release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          cp dist/EnsoCode-Setup-*.exe dist/*.blockmap dist/latest.yml dist/release-assets/
          node scripts/release.mjs verify dist/release-assets

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Install verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download verified Windows installer
        uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: release-assets/

      - name: Upload verified Windows draft
        run: |
          set -euo pipefail
          PUBLISHED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG and .draft == false) | .tag_name')
          test -z "$PUBLISHED" || { echo 'Published versions are immutable; use a new version.'; exit 1; }
          node scripts/release.mjs verify release-assets
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --prerelease --latest=false \
              --title "EnsoCode ${TAG#windows-v} — Windows x64" \
              --notes 'Windows x64 only. Verified installer, native dependencies, bundled design engine and checksums. Draft pending Windows installation and data-retention acceptance; not an automatic-update release.'
          fi
          gh release upload "$TAG" release-assets/* --clobber

      - name: Verify remote Windows draft
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir downloaded
          (cd downloaded && sha256sum -c SHA256SUMS)
          node scripts/release.mjs verify downloaded
          diff release-assets/SHA256SUMS downloaded/SHA256SUMS
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          echo "Verified Windows-only draft: $TAG. Installation acceptance is still required." >> "$GITHUB_STEP_SUMMARY"
