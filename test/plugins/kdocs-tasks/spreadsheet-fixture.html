<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>隔离需求表夹具（非真实金山服务）</title>
<style>
body {font:16px sans-serif;margin:30px}input {font:inherit;min-width:200px;min-height:28px}.sheet-active{margin:20px 0}.edit-proxy-runs{display:none}#grid{margin-top:20px;border:1px solid #aaa;padding:30px;width:400px}
</style>
<div class="sheet-active">需求清单2026</div>
<label>地址<input class="edit-box" value="A1"></label>
<div id="grid" role="grid" tabindex="0">隔离需求数据</div>
<input class="edit-proxy-runs" aria-label="单元格编辑器">
<script>
const values={A1:'编号',A2:'ERP-1',B2:'订单保存失败',D2:'待处理',E2:'谢',G2:'人工备注',H2:''};
const nameBox=document.querySelector('.edit-box'),editor=document.querySelector('.edit-proxy-runs'),grid=document.querySelector('#grid');
let selected='A1';
nameBox.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();selected=nameBox.value;grid.focus();}});
grid.addEventListener('keydown',event=>{if(event.key==='F2'){event.preventDefault();editor.value=values[selected]??'';editor.style.display='block';editor.focus();}});
editor.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key==='Escape'){event.preventDefault();if(event.key==='Enter')values[selected]=editor.value;editor.style.display='none';grid.focus();}});
document.addEventListener('keydown',event=>{
  if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='c'){
    const match=/^([A-Z])([0-9]+)(?::([A-Z])([0-9]+))?$/.exec(selected);
    if(!match)return;
    const fromRow=Number(match[2])-1,toRow=Number(match[4]||match[2])-1,fromCol=match[1].charCodeAt(0)-65,toCol=(match[3]||match[1]).charCodeAt(0)-65;
    const rows=[];
    for(let row=fromRow;row<=toRow;row++){const cells=[];for(let col=fromCol;col<=toCol;col++)cells.push(values[String.fromCharCode(65+col)+(row+1)]??'');rows.push(cells.join('\t'));}
    const transfer=new DataTransfer();
    transfer.setData('text/plain',rows.join('\r\n'));
    transfer.setData('text/ksDocClipBoardInfo',JSON.stringify({srcRange:`sheetIdx:0,rowFrom:${fromRow},rowTo:${toRow},colFrom:${fromCol},colTo:${toCol},sheetStId:1`}));
    event.preventDefault();
  }
});
window.fixtureValues=values;
</script>
</html>
